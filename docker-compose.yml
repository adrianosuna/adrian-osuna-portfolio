# Producción con Docker: app Next.js + MySQL propio (BD desde cero).
#
# Uso (con .env.production en esta carpeta, ver .env.production.example):
#   docker compose --env-file .env.production build
#   docker compose --env-file .env.production --profile setup run --rm migrate   # solo la 1.ª vez
#   docker compose --env-file .env.production up -d
#
# El proxy inverso del host (Nginx/Caddy con HTTPS, 301 y rate limit en /api/*)
# apunta a http://localhost:9443.

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-portfolio}
      MYSQL_USER: ${MYSQL_USER:-portfolio}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?falta MYSQL_PASSWORD en .env.production}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?falta MYSQL_ROOT_PASSWORD en .env.production}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 12
    # Techo a los logs: sin esto json-file crece sin límite y llena el disco del
    # VPS — justo lo que vigila el Panel de control. 10 MB × 3 ficheros rotados.
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    # Límite de memoria: descoméntalo ajustándolo a la RAM del VPS. Sin cifra a
    # ciegas — un límite demasiado bajo provoca el OOM que se quiere evitar.
    # mem_limit: 768m

  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?falta NEXT_PUBLIC_SITE_URL en .env.production}
        NEXT_PUBLIC_GA_ID: ${NEXT_PUBLIC_GA_ID:-}
    restart: unless-stopped
    env_file: .env.production
    environment:
      # Ruta interna del volumen de backups para el monitor de infraestructura.
      INFRA_BACKUPS_DIR: /backups
      # El .env.production lleva MYSQL_ROOT_PASSWORD porque `db` lo interpola del
      # --env-file, pero la app NO lo necesita (conecta con DATABASE_URL). Se
      # anula aquí —`environment` gana a `env_file`— para que el proceso Next no
      # herede el root de la BD: un vuelco de env o una traza no lo expondría.
      MYSQL_ROOT_PASSWORD: ""
    ports:
      # Atado a loopback: Docker se salta el firewall del sistema (ufw), así
      # que solo el proxy inverso del propio servidor puede llegar al 9443.
      - "127.0.0.1:9443:9443"
    volumes:
      # Solo lectura: el monitor de infraestructura lee la edad de los dumps
      # del cron y, de paso, el uso de disco del VPS (statfs sobre la carpeta).
      - ${BACKUPS_HOST_DIR:-/home/ubuntu/backups}:/backups:ro
    # Salud real de la app, no solo "el proceso vive": si Next se cuelga
    # respondiendo mal, `restart: unless-stopped` no lo pilla sin esto. La
    # imagen alpine trae wget (busybox).
    #
    # Apunta a /api/health (liveness), que NO toca la base de datos: un
    # healthcheck que la comprobara reiniciaría `web` cada vez que la BD
    # tarda en arrancar, que es justo el bucle que se quiere evitar. Para
    # saber si además puede servir datos está /api/ready (503 si la BD no
    # responde), pensado para un balanceador, no para reiniciar nada.
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9443/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    # mem_limit: 512m   # ver la nota del servicio db
    depends_on:
      db:
        condition: service_healthy

  # Crea las tablas (migración baseline) y asegura ADMIN_EMAIL como admin.
  # Solo con `--profile setup run --rm migrate`; no forma parte del `up`.
  migrate:
    profiles: ["setup"]
    build:
      context: .
      target: migrate
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?falta NEXT_PUBLIC_SITE_URL en .env.production}
    env_file: .env.production
    # Igual que `web`: migrate conecta con DATABASE_URL, no necesita el root.
    environment:
      MYSQL_ROOT_PASSWORD: ""
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
