# Verificación automática de cada push a main y de cada pull request.
#
# Dos jobs: `verificar` son las cuatro comprobaciones que hay que pasar antes
# de dar algo por terminado (CLAUDE.md) más un `pnpm audit` informativo, y
# `e2e` los tests de Playwright, que van aparte por lo que cuestan (navegador
# + build de producción).
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Un push encima de otro cancela el anterior: solo interesa el último commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    env:
      # El singleton de Prisma parsea DATABASE_URL al importar (src/lib/prisma.ts)
      # y prisma.config.ts la lee: nada aquí conecta a una BD, pero la URL tiene
      # que existir y tener formato válido. Mismo apaño que el Dockerfile.
      DATABASE_URL: mysql://ci:ci@localhost:3306/ci
      # Sin ella el build avisa de que la metadata apuntaría a localhost. El
      # aviso es correcto en producción y ruido aquí, así que se le da valor.
      NEXT_PUBLIC_SITE_URL: https://adrianosuna.com

    steps:
      - uses: actions/checkout@v5

      # Antes de setup-node: `cache: pnpm` necesita que pnpm ya exista. La
      # versión sale del campo `packageManager` de package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24 # la misma que la imagen de producción
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # src/generated está en .gitignore: el cliente se genera aquí.
      - run: pnpm prisma generate

      - run: pnpm lint
      - run: pnpm exec tsc --noEmit
      - run: pnpm test
      - run: pnpm build

      # Aviso (no fallo) si hay dependencias con avisos de seguridad. No
      # rompe el CI a propósito: un aviso publicado en una transitiva que no
      # se puede subir todavía no debe bloquear un despliegue urgente. Sale en
      # el resumen del job para que se vea sin buscarlo.
      - name: Auditoría de dependencias (informativa)
        if: always()
        run: pnpm audit || echo "⚠ Hay avisos de seguridad: ver la salida" >> $GITHUB_STEP_SUMMARY

  # Los e2e van en un job APARTE porque necesitan un navegador (~150 MB) y un
  # build de producción: mezclarlos con las comprobaciones rápidas alargaría
  # cada push. Si `verificar` falla, esto no llega a ejecutarse.
  e2e:
    needs: verificar
    runs-on: ubuntu-latest
    env:
      # No hay BD en el CI, y es a propósito: los e2e comprueban que sin
      # sesión no se sirve nada y que la API rechaza sin token —cosas que no
      # dependen de la BD—. Los endpoints que sí la necesitan aceptan el 503
      # como respuesta válida (ver e2e/seguridad.spec.ts).
      DATABASE_URL: mysql://ci:ci@localhost:3306/ci
      NEXT_PUBLIC_SITE_URL: https://adrianosuna.com
      CI: "1"

    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma generate

      # Solo Chromium: los tres motores triplicarían el tiempo para probar
      # cabeceras y códigos de estado, que no dependen del navegador.
      - run: pnpm exec playwright install --with-deps chromium

      # El propio playwright.config.ts hace el build y levanta el servidor.
      - run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
