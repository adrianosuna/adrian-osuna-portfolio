# CI de cada push a main y pull request. Dos jobs: `verificar` (lint, tsc, test,
# build y un audit informativo) y `e2e` (Playwright, aparte por lo que cuesta).
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Un push encima de otro cancela el anterior: solo interesa el último commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    env:
      # Prisma parsea DATABASE_URL al importar: nada conecta, pero la URL tiene que existir
      # y ser válida. Mismo apaño que el Dockerfile.
      DATABASE_URL: mysql://ci:ci@localhost:3306/ci
      # Sin ella el build avisa de que la metadata apuntaría a localhost. El
      # aviso es correcto en producción y ruido aquí, así que se le da valor.
      NEXT_PUBLIC_SITE_URL: https://adrianosuna.com

    steps:
      - uses: actions/checkout@v5

      # Antes de setup-node: `cache: pnpm` necesita que pnpm ya exista. La
      # versión sale del campo `packageManager` de package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24 # la misma que la imagen de producción
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # src/generated está en .gitignore: el cliente se genera aquí.
      - run: pnpm prisma generate

      - run: pnpm lint
      - run: pnpm exec tsc --noEmit
      - run: pnpm test
      - run: pnpm build

      # Audit informativo, no rompe el CI. En bloque (`run: |`) porque el mensaje lleva
      # «: » y en un escalar sin comillas YAML abre una clave: el workflow entero se invalida.
      - name: Auditoría de dependencias (informativa)
        if: always()
        run: |
          pnpm audit || echo "⚠ Hay avisos de seguridad: ver la salida" >> $GITHUB_STEP_SUMMARY

  # Los e2e van aparte: necesitan navegador y build de producción. Si `verificar`
  # falla, no se ejecutan.
  e2e:
    needs: verificar
    runs-on: ubuntu-latest
    env:
      # Sin BD en el CI a propósito: los e2e comprueban lo que no depende de ella y los
      # endpoints que sí la necesitan aceptan 503.
      DATABASE_URL: mysql://ci:ci@localhost:3306/ci
      NEXT_PUBLIC_SITE_URL: https://adrianosuna.com
      CI: "1"

    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma generate

      # Solo Chromium: los tres motores triplicarían el tiempo para probar
      # cabeceras y códigos de estado, que no dependen del navegador.
      - run: pnpm exec playwright install --with-deps chromium

      # El propio playwright.config.ts hace el build y levanta el servidor.
      - run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
