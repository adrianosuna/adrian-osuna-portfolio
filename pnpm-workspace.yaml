allowBuilds:
  '@prisma/engines': true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - nodemailer@9.0.6
  - '@testing-library/react@16.3.3'

# deepmerge-ts <8 (vía prisma>@prisma/config) tiene GHSA-ggr8-5vv4-36mx
# (stack exhaustion); se fuerza la versión parcheada hasta que Prisma la suba.
overrides:
  deepmerge-ts: '>=8.0.0'
