allowBuilds:
  '@prisma/engines': true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - mariadb@3.4.7

# deepmerge-ts <8 (vía prisma>@prisma/config) tiene GHSA-ggr8-5vv4-36mx
# (stack exhaustion); se fuerza la versión parcheada hasta que Prisma la suba.
# uuid <11.1.1 (vía exceljs) tiene GHSA-w5hq-g745-h8pq: no es explotable aquí
# (solo v3/v5/v6 pasando `buf`, que exceljs no hace — usa v4), pero deja el
# audit en cero. exceljs sigue funcionando: usa `require('uuid').v4`, que v11
# mantiene; solo desaparecieron los subpaths `uuid/v4`, que exceljs no usa.
# mariadb 3.4.5 (el pin EXACTO de @prisma/adapter-mariadb) arrastra cuatro
# avisos: fuga de la contraseña ante un MitM pese a ssl:true, transmisión en
# claro, e inyección SQL al escapar parámetros Buffer con charsets
# big5/gbk/sjis/cp932/gb18030. Los cuatro se parchean en 3.4.7 — un PATCH de
# la misma minor, no el salto a 3.5.x que se temía cuando salieron: por eso
# ahora sí se fuerza. Retirar cuando el adapter suba su pin.
overrides:
  deepmerge-ts: '>=8.0.0'
  uuid: '>=11.1.1'
  mariadb: '3.4.7'
  mysql2: '>=3.22.0'
